name: Build and Publish Android

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
    paths-ignore:
      - ".trellis/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 0 }}
          filter: blob:none

      - name: Derive release identity
        id: release
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must match X.Y.Z exactly: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version_base="$GITHUB_REF_NAME"
            build_slot=0
            version_name="$GITHUB_REF_NAME"
            release_tag="$GITHUB_REF_NAME"
            release_title="NGA Just Works $GITHUB_REF_NAME"
            prerelease=false
            gradle_tasks="verifyReleaseTag :nga_phone_base_3.0:assembleRelease"
            apk_dir=release
            expected_debuggable=false
          else
            stable_base=""
            while IFS= read -r candidate; do
              if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                stable_base="$candidate"
                break
              fi
            done < <(git tag --merged "$GITHUB_SHA" --sort=-version:refname)
            if [[ -z "$stable_base" ]]; then
              echo "No stable X.Y.Z tag is reachable from $GITHUB_SHA" >&2
              exit 1
            fi

            version_base="$stable_base"
            commit_distance="$(git rev-list --first-parent --count "${stable_base}..${GITHUB_SHA}")"
            build_slot=$((commit_distance + 1))
            short_sha="${GITHUB_SHA:0:12}"
            version_name="${stable_base}-debug.${GITHUB_RUN_NUMBER}"
            release_tag="debug-${short_sha}"
            release_title="NGA Just Works ${version_name} (Debug)"
            prerelease=true
            gradle_tasks=":nga_phone_base_3.0:assemblePreview"
            apk_dir=preview
            expected_debuggable=true
          fi

          version_code="$(python3 scripts/derive_android_version_code.py "$version_base" "$build_slot")"
          {
            echo "CI_VERSION_NAME=$version_name"
            echo "CI_VERSION_CODE=$version_code"
          } >> "$GITHUB_ENV"
          {
            echo "tag=$release_tag"
            echo "title=$release_title"
            echo "prerelease=$prerelease"
            echo "gradle_tasks=$gradle_tasks"
            echo "apk_dir=$apk_dir"
            echo "expected_debuggable=$expected_debuggable"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nga-just-works-release.p12"
          chmod 600 "$RUNNER_TEMP/nga-just-works-release.p12"

      - name: Build signed APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/nga-just-works-release.p12
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          GRADLE_TASKS: ${{ steps.release.outputs.gradle_tasks }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          read -r -a gradle_tasks <<< "$GRADLE_TASKS"
          test "${#gradle_tasks[@]}" -ge 1
          ./gradlew "${gradle_tasks[@]}" --no-daemon

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          app_version="$CI_VERSION_NAME"
          mapfile -t source_apks < <(
            find "nga_phone_base_3.0/build/outputs/apk/${{ steps.release.outputs.apk_dir }}" \
              -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print
          )
          test "${#source_apks[@]}" -eq 1
          source_apk="${source_apks[0]}"
          mkdir -p dist
          release_apk="dist/NGA-Just-Works-${app_version}.apk"
          cp "$source_apk" "$release_apk"
          test "$(apkanalyzer manifest application-id "$release_apk")" = "com.github.tophtab.ngajustworks"
          test "$(apkanalyzer manifest version-name "$release_apk")" = "$app_version"
          test "$(apkanalyzer manifest version-code "$release_apk")" = "$CI_VERSION_CODE"
          test "$(apkanalyzer manifest min-sdk "$release_apk")" = "29"
          test "$(apkanalyzer manifest target-sdk "$release_apk")" = "35"
          test "$(apkanalyzer manifest debuggable "$release_apk")" = "${{ steps.release.outputs.expected_debuggable }}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk"
          (cd dist && sha256sum "$(basename "$release_apk")" > "$(basename "$release_apk").sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && sha256sum -c ./*.sha256)
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            release_tag="${{ steps.release.outputs.tag }}"
            existing_tag_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${release_tag}" \
                --jq ".[] | select(.ref == \"refs/tags/${release_tag}\") | .object.sha"
            )"
            if [[ -n "$existing_tag_sha" ]]; then
              test "$existing_tag_sha" = "$GITHUB_SHA"
            fi
            release_id="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                --jq ".[] | select(.tag_name == \"${release_tag}\") | .id"
            )"
            if [[ -n "$release_id" ]]; then
              test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.prerelease')" = "true"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                -f name="${{ steps.release.outputs.title }}" \
                -f target_commitish="$GITHUB_SHA" \
                -F prerelease=true >/dev/null
              gh release upload "$release_tag" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            else
              gh release create "$release_tag" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "${{ steps.release.outputs.title }}" \
                --generate-notes \
                --prerelease
            fi
          else
            release_notes="release-notes/${GITHUB_REF_NAME}.md"
            python3 scripts/validate_release_notes.py "$release_notes"
            gh release create "${{ steps.release.outputs.tag }}" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "${{ steps.release.outputs.title }}" \
              --notes-file "$release_notes" \
              --verify-tag
          fi

      - name: Remove older debug prereleases
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_DEBUG_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          old_tags="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
                --jq '.[] | select(.prerelease == true and ((.tag_name | startswith("preview-")) or (.tag_name | startswith("debug-")))) | .tag_name'
          )"
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$CURRENT_DEBUG_TAG" ]]; then
              gh release delete "$old_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag \
                --yes
            fi
          done <<< "$old_tags"
