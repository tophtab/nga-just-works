buildscript {
    ext {
        compose_version = '1.6.8'
        compose_ui_version = '1.7.0'
        compose_activity_version = '1.10.1'
        core_ktx_version = '1.7.0'
        appcompat_version = "1.7.1"
        androidx_material_version = '1.12.0'
        lifecycle_version = "2.6.2"
        retrofit_version = '2.6.0'
        paging_version = '3.3.0'
        arouter_version = '1.5.2'
        rxjava_version = '2.2.6'
    }
    repositories {
        // CI runs outside China, where the Aliyun mirrors are slow and intermittently
        // answer 502. Gradle treats that as fatal instead of falling through to the next
        // repository, so the canonical repositories go first there. Local builds keep the
        // mirrors in front.
        if (System.getenv('CI')) {
            google()
            mavenCentral()
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        } else {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            google()
            mavenCentral()
        }
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin
    }

}

allprojects {
    repositories {
        // Same CI/local ordering as the buildscript block above.
        if (System.getenv('CI')) {
            google()
            mavenCentral()
            maven { url 'https://maven.aliyun.com/repository/google' }
            //TODO Remove all dependencies in jcenter
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://www.jitpack.io' }
        } else {
            maven { url 'https://maven.aliyun.com/repository/google' }
            //TODO Remove all dependencies in jcenter
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://www.jitpack.io' }
            google()
            mavenCentral()
        }
    }

}

task clean(type: Delete) {
    delete rootProject.buildDir
}

def localAppVersionName = '4.5.0'
def localAppVersionCode = 4050
def ciVersionName = providers.environmentVariable('CI_VERSION_NAME').orNull
def ciVersionCode = providers.environmentVariable('CI_VERSION_CODE').orNull

if ((ciVersionName == null) != (ciVersionCode == null)) {
    throw new GradleException('CI_VERSION_NAME and CI_VERSION_CODE must be set together')
}

def effectiveAppVersionName = localAppVersionName
def effectiveAppVersionCode = localAppVersionCode

if (ciVersionName != null) {
    if (!(ciVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:-debug\.[0-9]+)?/)) {
        throw new GradleException("Invalid CI_VERSION_NAME: ${ciVersionName}")
    }

    long parsedVersionCode
    try {
        parsedVersionCode = Long.parseLong(ciVersionCode)
    } catch (NumberFormatException ignored) {
        throw new GradleException("Invalid CI_VERSION_CODE: ${ciVersionCode}")
    }
    if (parsedVersionCode < 1 || parsedVersionCode > 2100000000) {
        throw new GradleException("CI_VERSION_CODE is outside Android's supported range: ${ciVersionCode}")
    }

    effectiveAppVersionName = ciVersionName
    effectiveAppVersionCode = (int) parsedVersionCode
}

tasks.register('printAppVersion') {
    doLast {
        println project.appVersionName
    }
}

tasks.register('verifyReleaseTag') {
    doLast {
        def releaseTag = providers.environmentVariable('RELEASE_TAG').orNull
        if (!releaseTag) {
            throw new GradleException('RELEASE_TAG is required')
        }
        if (!(releaseTag ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException("Release tag must match X.Y.Z exactly: ${releaseTag}")
        }
        if (releaseTag != project.appVersionName) {
            throw new GradleException("Release tag ${releaseTag} does not match effective appVersionName ${project.appVersionName}")
        }
    }
}

project.ext {
    minSdkVersion = 29
    targetSdkVersion = 35
    compileSdkVersion = 35
    appVersionName = effectiveAppVersionName
    appVersionCode = effectiveAppVersionCode

    rxAndroid = '2.1.1'

    room_version = "2.4.1"

    preference_version = "1.1.1"
}
