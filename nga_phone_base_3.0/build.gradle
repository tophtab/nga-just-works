plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    alias(libs.plugins.compose.compiler)
}

def static getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyyMMddHHmm')
    return formattedDate
}

def signingStoreFile = System.getenv('ANDROID_SIGNING_STORE_FILE')
def signingStorePassword = System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
def signingConfigured = [
        signingStoreFile,
        signingStorePassword,
        signingKeyAlias,
        signingKeyPassword
].every { it != null && !it.trim().isEmpty() }

gradle.taskGraph.whenReady { taskGraph ->
    def releasePackageRequested = taskGraph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().matches('.*(assemble|bundle|package).*(release|preview).*')
    }
    if (releasePackageRequested && !signingConfigured) {
        throw new GradleException('Release signing requires ANDROID_SIGNING_STORE_FILE, ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, and ANDROID_SIGNING_KEY_PASSWORD')
    }
}

android {
    namespace "gov.anzong.androidnga"
    compileSdk project.compileSdkVersion

    defaultConfig {
        applicationId "com.github.tophtab.ngajustworks"
        minSdkVersion project.minSdkVersion
        targetSdkVersion project.targetSdkVersion
        resConfigs "zh", "en"

        versionCode project.appVersionCode
        versionName project.appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }

        kapt {
            arguments {
                arg("AROUTER_MODULE_NAME", project.getName())
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingConfigured) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            minifyEnabled true
            proguardFiles 'proguard.cfg'
            zipAlignEnabled true
            if (signingConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
            minifyEnabled false
        }
        preview {
            initWith release
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled false
            if (signingConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    lintOptions {
        abortOnError false
        disable 'MissingTranslation'
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            if (outputFile != null && outputFileName.endsWith('.apk') && variant.buildType.name == "release") {
                outputFileName = "nga_phone_${defaultConfig.versionName}_${getDate()}.apk"
            }
        }
    }
}

dependencies {
    implementation "com.google.android.material:material:$androidx_material_version"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation 'commons-io:commons-io:2.11.0'

    // lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    //butterKnife
    implementation 'com.jakewharton:butterknife:10.2.1'
    implementation 'androidx.compose.material3:material3-android:1.3.2'
    implementation 'androidx.compose.animation:animation-android:1.6.8'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'
    kapt 'com.jakewharton:butterknife-compiler:10.2.1'

    //compose
    implementation "androidx.activity:activity-compose:$compose_activity_version"
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"

    //glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    kapt 'com.github.bumptech.glide:compiler:4.11.0'

    // retrofit
    // AI RequestBody.isOneShot() requires the version already resolved by the app runtime.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation 'io.reactivex.rxjava2:rxandroid:2.0.1'
    implementation "com.squareup.retrofit2:retrofit-converters:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofit_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    implementation 'com.jakewharton.rxbinding2:rxbinding:2.0.0'
    implementation 'com.trello.rxlifecycle2:rxlifecycle-components:2.1.0'
    implementation "com.alibaba:arouter-api:$arouter_version"
    annotationProcessor "com.alibaba:arouter-compiler:$arouter_version"
    kapt "com.alibaba:arouter-compiler:$arouter_version"
    implementation 'com.github.tbruyelle:rxpermissions:0.10.2'
    implementation 'com.github.daniel-stoneuk:material-about-library:2.3.0'
    implementation project(':lib_base_common')
    implementation project(':lib_bu_statistics')
    implementation project(':lib_core')
    implementation project(':lib_base_logger')

    implementation project(':lib_base_network')
    implementation project(':lib_core_data')
    implementation project(':lib_bu_message')
    implementation project(':lib_bu_account')
    implementation project(':lib_base_service_api')
    implementation project(':lib_base_ui_compose')
    implementation project(':lib_base_ui')

    implementation project(':lib_module_debug')

    // database
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // kotlin
    implementation "androidx.core:core-ktx:$core_ktx_version"

    //noinspection KtxExtensionAvailable
    implementation "androidx.preference:preference:$preference_version"

    // paging
    implementation "androidx.paging:paging-compose:$paging_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
}
